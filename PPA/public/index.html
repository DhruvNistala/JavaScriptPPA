<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments Calendar</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header class="pageHeader">
    <h1 id="monthTitle">Appointments</h1>
    <p class="subtitle">Create, view, and delete appointments.</p>
  </header>

  <section id="message" class="message" aria-live="polite"></section>

  <section class="panel">
    <h2>Create Appointment</h2>
    <div class="formRow">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" placeholder="Enter Event Title">
    </div>
    <div class="formRow">
      <label for="dateTimeInput">Date &amp; Time</label>
      <input type="datetime-local" id="dateTimeInput">
    </div>
    <div class="formRow">
      <label for="notesInput">Notes</label>
      <input type="text" id="notesInput" placeholder="">
    </div>
    <button id="createAppointmentButton">Add Appointment</button>
  </section>

  <section class="panel">
    <h2>Month View</h2>
    <div id="calendarGrid"></div>
  </section>

  <script src="/script.js"></script>
</body>

</html>
