<!-- public/provider.html -->
<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Provider Calendar</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <h1 id="monthTitle"></h1>
  <div id="message"></div>
  <section>
    <button id="prevMonthButton">Previous month</button>
    <button id="nextMonthButton">Next month</button>
  </section>
  <section id="createSlotPanel">
    <h2>Create a slot</h2>
    <label>Start time ISO
      <input type="datetime-local" id="startTimeInput" name="startTimeInput" value="2026-03-01T09:00"
        min="2026-01-01T00:00" max="2026-12-31T23:59" />
    </label>
    <label>End time ISO
      <input type="datetime-local" id="endTimeInput" name="endTimeInput" value="2026-03-01T09:30" min="2026-01-01T00:00"
        max="2026-12-31T23:59" />
    </label>
    <button id="createSlotButton">Create slot</button>
  </section>
  <section>
    <h2>Month view</h2>
    <div id="calendarGrid"></div>
  </section>
  <dialog id="appointmentModal">
    <input type="hidden" id="appointmentIdInput">
    <label>Start time
      <input type="datetime-local" id="appointmentStartTimeInput">
    </label>
    <label>End time
      <input type="datetime-local" id="appointmentEndTimeInput">
    </label>
    <label>Status
      <select id="appointmentStatusInput">
        <option value="available">available</option>
        <option value="booked">booked</option>
      </select>
    </label>
    <button id="saveAppointmentButton">Save</button>
    <button id="deleteAppointmentButton">Delete</button>
    <button id="closeAppointmentButton">Close</button>
  </dialog>
  <script src="/client_code.js"></script>
  <script src="/provider.js"></script>
</body>

</html>
