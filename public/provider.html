<!-- public/provider.html -->
<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Provider Calendar</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <h1 id="monthTitle"></h1>
  <div id="message"></div>
  <section id="createSlotPanel">
    <h2>Create a slot</h2>
    <label>Start time ISO
      <input type="datetime-local" id="startTimeInput" name="startTimeInput" value="2018-06-12T19:30"
        min="2018-06-07T00:00" max="2018-06-14T00:00" />
    </label>
    <label>End time ISO
      <input type="datetime-local" id="endTimeInput" name="endTimeInput" value="2018-06-12T19:30" min="2018-06-07T00:00"
        max="2018-06-14T00:00" />
    </label>
    <button id="createSlotButton">Create slot</button>
  </section>
  <section>
    <h2>Month view</h2>
    <div id="calendarGrid"></div>
  </section>
  <script src="/provider.js"></script>
</body>

</html>
